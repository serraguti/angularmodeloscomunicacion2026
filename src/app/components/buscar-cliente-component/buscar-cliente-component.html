<h1>Buscador cliente JSON</h1>
<form #form="ngForm">
    Introduzca un ID de cliente
    <input type="number" name="cajaid" #cajaid/>
    <button (click)="buscarCliente()">
        Buscar cliente
    </button>
</form>
@if (cliente){
    <h1 style="color:blue">
        Nombre: {{cliente.nombre}}
    </h1>
    <p>{{cliente.paginaweb}}</p>
    <img src="{{cliente.imagencliente}}"
        style="width: 150px; height: 150px;"/>  
}
